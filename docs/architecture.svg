  <rect x="76" y="380" width="250" height="42" rx="6" fill="#1b2130" stroke="#3a4453"/>
  <text x="86" y="398" font-size="11" fill="#e6edf3">1 · 快路径 tryFast（秒级）</text>
  <text x="86" y="414" font-size="10" fill="#8b949e">仅新文件 ≤4 + 语法门；disableFastPath 关闭</text>

  <rect x="76" y="434" width="250" height="34" rx="6" fill="#1b2130" stroke="#3a4453"/>
  <text x="86" y="456" font-size="11" fill="#e6edf3">2 · Jev 路由 answered | build</text>

  <rect x="76" y="482" width="250" height="42" rx="6" fill="#1b2130" stroke="#3a4453"/>
  <text x="86" y="500" font-size="11" fill="#e6edf3">3 · 规划 planGoal：JSON-DAG</text>
  <text x="86" y="516" font-size="10" fill="#8b949e">tasks[]·depends_on→波次·success_criteria</text>

  <rect x="350" y="380" width="254" height="144" rx="6" fill="#1b2130" stroke="#3a4453"/>
  <text x="360" y="398" font-size="11" fill="#e6edf3">4 · 轮次循环 runAdaptive</text>
  <text x="360" y="416" font-size="10" fill="#8b949e">预算门 → 轮快照 round-* → 变异体竞争</text>
  <text x="360" y="432" font-size="10" fill="#8b949e">K=3 策略 A/B/C（可用模型交织取）</text>
  <text x="360" y="448" font-size="10" fill="#8b949e">createInheritNode(fork)+BB_HINT 黑板</text>
  <text x="360" y="464" font-size="10" fill="#8b949e">waitTerminal → 波次合并 applyNode</text>
  <text x="360" y="480" font-size="10" fill="#8b949e">黑板合并 → 缺件闭包 → 收敛守卫</text>
  <text x="360" y="500" font-size="10" fill="#8b949e">经验调整 experienceAdjust·自策略 vN</text>
  <text x="360" y="516" font-size="10" fill="#8b949e">verifier-skip 学习(≥3 全对→跳验收)</text>

  <rect x="76" y="558" width="528" height="76" rx="6" fill="#12261a" stroke="#2ea04366"/>
  <text x="92" y="580" font-size="11.5" font-weight="bold" fill="#3fb950">5 · 验收级联（便宜→贵）</text>
  <text x="92" y="600" font-size="11" fill="#cde2d1">Jev 概率 ≥0.85 放行 → 独立验收员(merge+verify·VERDICT/ FITNESS/逐条 PASS|FAIL)</text>
  <text x="92" y="618" font-size="11" fill="#cde2d1">→ 低置信(fitness&lt;0.6)跨模型复核 → 未过题回炉/变异体重跑</text>

  <rect x="76" y="650" width="528" height="88" rx="6" fill="#1b2130" stroke="#3a4453"/>
  <text x="92" y="672" font-size="11.5" font-weight="bold" fill="#e6edf3">6 · 落盘与学习</text>
  <text x="92" y="692" font-size="10.5" fill="#8b949e">STATE.md 滚动 · routing.jsonl 记录(判据/fitness/tokens/wall)</text>
  <text x="92" y="708" font-size="10.5" fill="#8b949e">decisions.jsonl 决策外置 · self-policy.json 自策略 · 最终回复交聊天网关</text>
  <text x="92" y="724" font-size="10.5" fill="#8b949e">路由史喂给下一轮 experienceAdjust（就在本函数里闭环）</text>

