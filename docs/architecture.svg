  <!-- ================= Notes ================= -->
  <rect x="40" y="1016" width="1140" height="120" rx="12" fill="#081018" stroke="#21262d"/>
  <text x="60" y="1042" font-size="13" font-weight="bold" fill="#e6edf3">架构注记</text>
  <text x="60" y="1064" font-size="11" fill="#8b949e">· 事件主干：跨模块交互统一走 events.ts 的 occ:event —— 渲染层、聊天日志、Jev 校准共用同一份数据流</text>
  <text x="60" y="1082" font-size="11" fill="#8b949e">· 引擎判别：会话 id 前缀 agt_ 即 native（session.ts），否则为 opencode 会话；native 无需 opencode 服务也可全功能运行</text>
  <text x="60" y="1100" font-size="11" fill="#8b949e">· 单点风险：executor.ts 一文件集中规划/快路径/轮次/验收/自策略；ipc.ts 是唯一 IPC 面（治理拆分是下一步）</text>
  <text x="60" y="1118" font-size="11" fill="#8b949e">· 成本阶梯：快路径(秒) ≪ 单轮(分) ≪ 变异体竞争轮 ≪ 跨模型复核 —— 便宜的检查永远先跑</text>

