  <rect width="1560" height="1200" fill="#0d1117"/>
  <text x="44" y="44" font-size="26" font-weight="bold" fill="#e6edf3">OpenCodeCanvas 2.0 · 项目级编排 Agent 系统 · 架构图</text>
  <text x="44" y="68" font-size="13" fill="#8b949e">画布即工作台：每次对话 = 一个可继承的节点，繁重工作 fork 出去，独立验收员把关，图谱落盘为唯一事实源</text>

  <!-- ================= Row A: Renderer ================= -->
  <rect x="40" y="84" width="1140" height="180" rx="12" fill="#10161d" stroke="#30363d"/>
  <text x="60" y="112" font-size="15" font-weight="bold" fill="#79c0ff">渲染层 Renderer · React 18 + React Flow + zustand</text>

  <rect x="60" y="128" width="300" height="118" rx="8" fill="#151b23" stroke="#2f3841"/>
  <text x="74" y="150" font-size="13" font-weight="bold" fill="#e6edf3">图形画布 · GraphCanvas.tsx</text>
  <text x="74" y="172" font-size="11" fill="#9aa7b4">节点卡 ChatNode(状态点/运行条/轮次折叠)</text>
  <text x="74" y="188" font-size="11" fill="#9aa7b4">OccNode(diff/inspect/apply 按钮)</text>
  <text x="74" y="204" font-size="11" fill="#9aa7b4">边样式: fork 紫 · inherit 蓝 · merge 绿</text>
  <text x="74" y="220" font-size="11" fill="#9aa7b4">layout.ts 落位/持久 pin/休眠层/镜头策略</text>

  <rect x="380" y="128" width="300" height="118" rx="8" fill="#151b23" stroke="#2f3841"/>
  <text x="394" y="150" font-size="13" font-weight="bold" fill="#e6edf3">zustand occStore.ts</text>
  <text x="394" y="172" font-size="11" fill="#9aa7b4">slices: chats · graph · models</text>
  <text x="394" y="188" font-size="11" fill="#9aa7b4">streams(流式) · policy · eventLog · inspectCache</text>
  <text x="394" y="204" font-size="11" fill="#9aa7b4">actions: openProject / createChat / sendChat</text>
  <text x="394" y="220" font-size="11" fill="#9aa7b4">updatePolicy / freeze / apply / abort</text>
  <text x="394" y="236" font-size="10" fill="#6e7a87">窗口暴露 window.__occStore（自动化用）</text>

  <rect x="700" y="128" width="212" height="118" rx="8" fill="#151b23" stroke="#2f3841"/>
  <text x="714" y="150" font-size="13" font-weight="bold" fill="#e6edf3">GUI 自动化 automation.ts</text>
  <text x="714" y="172" font-size="11" fill="#9aa7b4">?auto=1 有 &amp;suite= → 套件 T1–T20</text>
  <text x="714" y="188" font-size="11" fill="#9aa7b4">无 suite= → 观察模式(只开 store)</text>
  <text x="714" y="204" font-size="11" fill="#9aa7b4">结果经 document.title</text>
  <text x="714" y="220" font-size="11" fill="#9aa7b4">OCC-AUTOTEST: → 回落 %TEMP%</text>

