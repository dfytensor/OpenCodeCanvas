  <text x="656" y="528" font-size="11" fill="#9aa7b4">deepseek · zhipu(glm-4.6/4.5-air) · opencode.json 自定义（key 在 auth.json）</text>
  <text x="656" y="544" font-size="11" fill="#9aa7b4">failover 链 resolveAgentModelChain（429/错误逐级回退）</text>
  <text x="656" y="560" font-size="11" fill="#9aa7b4">Jev 决策：本地 llama-server(自托管) → OpenRouter jev-1.13 → 级联</text>

  <rect x="640" y="592" width="520" height="62" rx="8" fill="#151b23" stroke="#2f3841"/>
