  <text x="656" y="388" font-size="11" fill="#9aa7b4">opencode 引擎：托管 opencode serve 单例 · SSE 订阅</text>
  <text x="656" y="404" font-size="11" fill="#9aa7b4">＋ 事件核对轮询 · ocApi(promptAsync/abort/fork…)</text>
  <text x="656" y="424" font-size="11" fill="#9aa7b4">native 引擎：agt_ 前缀 · loop.ts 自带工具循环</text>
  <text x="656" y="440" font-size="11" fill="#9aa7b4">net.fetch 4 重试[0,3,10,30s] · 工具5件 · 敏感工具权限门</text>
  <line x1="940" y1="464" x2="940" y2="482" stroke="#6e7a87" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="640" y="486" width="520" height="86" rx="8" fill="#151b23" stroke="#2f3841"/>
